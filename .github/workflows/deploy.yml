name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Solange die Pages-Quelle auf "Deploy from a branch" steht, deployt parallel ein
      # Legacy-Build den rohen Quellcode. Warten bis er fertig ist, damit unser
      # Deployment zuletzt landet und gewinnt (max. 5 Minuten).
      - run: |
          for i in $(seq 1 30); do
            busy=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=10" \
              --jq '[.workflow_runs[] | select(.name=="pages build and deployment" and .status!="completed")] | length')
            [ "$busy" = "0" ] && exit 0
            echo "Legacy-Pages-Build läuft noch, warte... ($i/30)"
            sleep 10
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/deploy-pages@v4
        id: deployment
